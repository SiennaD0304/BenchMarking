# OrthoPhy — similarity clustering with taxonomy/tree-conflict paralog filtering.
#
# OrthoPhy is installed from source (github.com/tmakwtnb/OrthoPhy) into
# tools/OrthoPhy; this env provides everything it needs to run. It ships no
# dependency list of its own, so the Python packages below come from its
# import statements and the programs from the steps it performs.
#
# Taxonomy is read from the DIRECTORY NESTING of --indir (species FASTAs in
# folders by clade); test_tools.py and run_tools.py build that layout from
# data/taxonomy.tsv.
#
# Create:  mamba env create -f environments/orthophy_environment.yml
name: orthophy
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Pinned: OrthoPhy.py imports distutils, which was removed in Python 3.12.
  - python=3.10

  # Python packages — every third-party import in OrthoPhy.py and bin/*.py
  - biopython           # Bio
  - numpy
  - scipy
  - pandas
  - dask
  - tqdm                # bin/reconstruct_tree.py

  # External programs OrthoPhy calls
  - blast               # homology search
  - diamond             # homology search
  - mcl                 # clustering; OrthoPhy sweeps the inflation value
  - mafft               # multiple sequence alignment
  - trimal              # alignment filtering (skipped with --no_filtering)
  - fasttree            # gene tree reconstruction
  - iqtree              # used by --accurate for the concatenated tree
  - raxml
  - seqkit              # sequence handling; checked at startup
  - iqtree=2            # OrthoPhy calls the iqtree2 binary by name; IQ-TREE 3 installs iqtree3

  # Optional --hgt prediction (IslandPath-DIMOB) needs Perl and BioPerl.
  # This project does not use --hgt.
  - perl